version: '3.8'
services:
  repair-flow:
    build: .
    container_name: repair-flow
    restart: always
    # REMOVED ports: "80:80" to avoid conflict with NPM
    volumes:
      - /var/www/html/sites/cyms:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      tigerforge-db:
        ipv4_address: 172.20.0.8
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      options:
        max-size: "10m"
        max-file: "3"

networks:
  tigerforge-db:
    external: true
server {
    listen 80;
    server_name _;
    root /var/www/html;
    index index.php index.html index.htm;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # =========================================================
    # SECURITY BLOCK 1: Sensitive root-level config files
    # Blocks: omnibase.cfg, docker-compose.yml, Dockerfile,
    #         .gitignore, composer.json/lock, nginx.conf, etc.
    # =========================================================
    location ~* ^/(omnibase\.cfg|docker-compose\.yml|Dockerfile|\.gitignore|nginx\.conf|composer\.(json|lock)|yii|README|backups|audit\.html) {
        deny all;
        return 404;
    }

    # =========================================================
    # SECURITY BLOCK 2: Hidden files and directories (dot files)
    # Blocks: .env, .git, .htaccess, etc.
    # =========================================================
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # =========================================================
    # SECURITY BLOCK 3: Sensitive application directories
    # Blocks: /runtime, /vendor, /config, /tests, /backups, etc.
    # =========================================================
    location ~* ^/(runtime|vendor|config|tests|bin|backups|modules|providers/components)/ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # =========================================================
    # SECURITY BLOCK 4: Sensitive file extensions
    # Blocks: .sql, .sql.gz, .cfg, .env, .sh, .log, .md, .yml
    # =========================================================
    location ~* \.(sql|sql\.gz|cfg|env|sh|log|md|yml|yaml|lock)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # =========================================================
    # SECURITY BLOCK 5: Debug toolbar
    # =========================================================
    location ~* /debug/ {
        return 404;
    }

    # =========================================================
    # PUBLIC: Static assets (JS, CSS, images, fonts)
    # =========================================================
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # =========================================================
    # PUBLIC: Yii2 front controller (all app routes)
    # =========================================================
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # =========================================================
    # PHP Processing
    # =========================================================
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param HTTPS off;
        fastcgi_param HTTP_X_FORWARDED_PROTO http;
        fastcgi_read_timeout 120;
    }

    # =========================================================
    # SECURITY HEADERS
    # =========================================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
}